name: Validate transfer configuration

on:
  workflow_dispatch:

jobs:
  validate-transfer-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate secure transfer config
        env:
          BANK_IBAN: ${{ secrets.BANK_IBAN }}
          BANK_TRANSFER_REFERENCE: ${{ secrets.BANK_TRANSFER_REFERENCE }}
        run: python secure_transfer_config.py
